<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Comentarios</title>
</head>
<body>

    <div class="card">
        <span class="title">Comentários</span>
        <div class="comments" id="comments"></div>
    </div>

<script>
     function getComentarios() {
         fetch('https://localhost:7052/Comentarios')
             .then(response => response.json())
             .then(data => { 

              const listacomentarios = document.getElementById('comments');

              //const react = document.getElementById('comment-react');

              listacomentarios.innerHTML = '';
              //listacomentarios.appendChild(react);

                 data.forEach(comentario => {
                     const comentarioDiv = document.createElement('div');
                     comentarioDiv.classList.add("comment-container");

                     const usert = document.createElement('div');
                     usert.classList.add("user");
                     comentarioDiv.appendChild(usert);
                     

                     const userf = document.createElement('div');
                     userf.classList.add("user-pic");
                     userf.innerHTML = `
                        <svg fill="none" viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linejoin="round" fill="#707277" stroke-linecap="round" stroke-width="2" stroke="#707277" d="M6.57757 15.4816C5.1628 16.324 1.45336 18.0441 3.71266 20.1966C4.81631 21.248 6.04549 22 7.59087 22H16.4091C17.9545 22 19.1837 21.248 20.2873 20.1966C22.5466 18.0441 18.8372 16.324 17.4224 15.4816C14.1048 13.5061 9.89519 13.5061 6.57757 15.4816Z"></path>
                            <path stroke-width="2" fill="#707277" stroke="#707277" d="M16.5 6.5C16.5 8.98528 14.4853 11 12 11C9.51472 11 7.5 8.98528 7.5 6.5C7.5 4.01472 9.51472 2 12 2C14.4853 2 16.5 4.01472 16.5 6.5Z"></path>
                        </svg>
                     `;
                     usert.appendChild(userf);

                     const useri = document.createElement('div');
                     useri.classList.add("user-info");
                     usert.appendChild(useri);

                     const spanNome = document.createElement('span');
                     spanNome.textContent = comentario.nome.toLowerCase().split(' ').map(nome => nome.charAt(0).toUpperCase() + nome.slice(1)).join(' ');
                     useri.appendChild(spanNome);


                     const spanData = document.createElement('p');
                     const data = new Date(comentario.dataHora);
                     spanData.textContent =
                     data.toLocaleDateString('pt-BR') +
                     ' ' +   
                     data.toLocaleTimeString('pt-BR', {
                     hour: '2-digit',
                     minute: '2-digit'
                     });
                      
                     useri.appendChild(spanData);


                     const parCom = document.createElement('p');
                     parCom.classList.add("comment-content");
                     parCom.textContent = comentario.comentario;
                     comentarioDiv.appendChild(parCom);

                     listacomentarios.appendChild(comentarioDiv);
                 });


             });
     }
     getComentarios()
 </script>
</body>
</html>

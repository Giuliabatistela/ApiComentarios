<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Comentários</title>
</head>
<body>

    <div class="form-card">
        <div class="form-title">Deixe seu comentário</div>
        <p class="form-subtitle">Veja o que as pessoas estão comentando e compartilhe sua opinião.</p>

        <form id="formComentarios">
            <div class="form-group">
            <label for="nome">Nome</label>
                <input type="text" id="nome" class="form-input" />
            </div>

            <div class="form-group">
            <label for="comentario">Comentário</label>
            <textarea id="comentario" class="form-textarea"></textarea>
            </div>

        <button type="submit" class="form-btn">Enviar comentário</button>
        </form>

    </div>
            <script>
            function addComentarios(event) {
                event.preventDefault();

                const nome = document.getElementById('nome').value;
                const comentario = document.getElementById('comentario').value;


                const newComentario = {
                    Nome: nome,
                    Comentario: comentario
                };

 

                fetch('https://localhost:7052/Comentarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newComentario)
                })
                    .then(response => {
                        if (response.ok) {
                            document.getElementById('nome').value = '';
                            document.getElementById('comentario').value = '';
                        }
                    });

            }
            document.getElementById('formComentarios').addEventListener('submit', addComentarios);
        </script>

</body>
</html>
